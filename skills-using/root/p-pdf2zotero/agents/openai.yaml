interface:
  display_name: "P PDF to Zotero"
  short_description: "Import PDFs with selective ratings and Extra notes"
  default_prompt: "Use $p-pdf2zotero to import these local PDFs into the specified Zotero collection, draft quota-limited star ratings and concise Extra notes in a review file for my confirmation, then write them."

